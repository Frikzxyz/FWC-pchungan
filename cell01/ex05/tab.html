<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            height: 200px;
        }
        td {
            width: 50%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .first-cell {
            background-color: #4A90E2;
        }
        .second-cell {
            background-color: #E74C3C;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>

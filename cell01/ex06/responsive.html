<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            width: 50%;
            text-align: center;
            font-size: 3vw;
            font-weight: bold;
            color: white;
        }
        .first-cell {
            background-color: #4A90E2;
        }
        .second-cell {
            background-color: #E74C3C;
        }
        @media (max-width: 600px) {
            tr {
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            td {
                width: 100%;
                height: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
